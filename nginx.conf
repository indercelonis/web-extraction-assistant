server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static browser app — all processing stays in the user's browser.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|wasm|mjs|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
}
